name: Build NetSwitch macOS DMG

on:
  workflow_dispatch:
  push:
    paths:
      - 'netswitch/**'
      - '.github/workflows/build-mac.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: |
          python3 -m pip install --upgrade pip pyinstaller
          python3 -c "import tkinter; print('tkinter OK')"

      - name: Build .app
        working-directory: netswitch
        env:
          PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: bash build_mac.sh 2>&1 | tee build_log.txt; test ${PIPESTATUS[0]} -eq 0

      - name: Create DMG
        working-directory: netswitch
        run: bash create_dmg.sh

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete netswitch-macos -y || true
          gh release create netswitch-macos netswitch/NetSwitch.dmg \
            --title "NetSwitch macOS" \
            --notes "自动构建（Intel x86_64，ad-hoc 签名）。下载后双击挂载 → 拖入应用程序；首次打开若被拦，右键 NetSwitch.app → 打开。"
